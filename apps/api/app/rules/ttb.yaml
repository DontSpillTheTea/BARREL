# NOTE: This file is legacy/bootstrap.
# The canonical rules catalog is now located in the top-level rules/ttb/ directory.
rules:
  - id: health_warning_statement
    category: health_warning
    description: "Government Health Warning Statement must be present and match required text exactly."
    required_text: "GOVERNMENT WARNING: (1) According to the Surgeon General, women should not drink alcoholic beverages during pregnancy because of the risk of birth defects. (2) Consumption of alcoholic beverages impairs your ability to drive a car or operate machinery, and may cause health problems."
    citation: "https://www.ecfr.gov/current/title-27/chapter-I/subchapter-A/part-16"
    advisory: true

  - id: brand_name
    category: branding
    description: "Brand name must be present and legible."
    citation: "https://www.ecfr.gov/current/title-27/chapter-I/subchapter-A/part-5"
    advisory: true

  - id: alcohol_content
    category: contents
    description: "Alcohol content by volume (ABV) must be stated. Format requirements vary by class."
    citation: "https://www.ttb.gov/regulated-commodities/labeling/laws-and-regulations"
    advisory: true

  - id: net_contents
    category: contents
    description: "Net contents must be stated in standard metric volumes (e.g., 750 mL)."
    citation: "https://www.ecfr.gov/current/title-27/chapter-I/subchapter-A/part-5"
    advisory: true

  - id: class_type
    category: classification
    description: "Product must have a recognized class and type designation (e.g., Vodka, Bourbon Whiskey)."
    citation: "https://www.ecfr.gov/current/title-27/chapter-I/subchapter-A/part-5"
    advisory: true

notes:
  - "TODO: Add more granular checks based on specific beverage classes."
  - "DISCLAIMER: These rules are advisory prototypes and do not constitute legal determinations."
