version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  help:
    cmds:
      - task --list
    silent: true

  check-env:
    desc: Check local tooling
    cmds:
      - python3 scripts/check_env.py

  dev:
    desc: Run the full stack in development mode using Docker Compose
    cmds:
      - docker compose up --build

  up:
    desc: Run the full stack in the background
    cmds:
      - docker compose up -d --build

  down:
    desc: Stop the full stack
    cmds:
      - docker compose down

  restart:
    desc: Restart the full stack
    cmds:
      - docker compose restart

  logs:
    desc: Follow logs from Docker Compose
    cmds:
      - docker compose logs -f

  build:
    desc: Build Docker images without starting them
    cmds:
      - docker compose build

  rebuild:
    desc: Down, build, and up the stack
    cmds:
      - task down
      - task build
      - task up

  ps:
    desc: Show running services
    cmds:
      - docker compose ps

  test:
    desc: Run all tests
    cmds:
      - task test:api
      - task test:ocr
      - task test:web

  test:api:
    desc: Run API tests
    cmds:
      - cd apps/api && go test ./...

  test:ocr:
    desc: Run OCR worker tests
    cmds:
      - docker compose exec -e PYTHONPATH=/app -T ocr-worker pytest

  ocr:compare:
    desc: Run OCR quality comparison
    cmds:
      - docker compose exec -e PYTHONPATH=/app -T ocr-worker python /scripts/compare_ocr.py

  smoke:
    desc: Run smoke tests
    cmds:
      - task smoke:backend
      - task smoke:web

  smoke:backend:
    desc: Run backend smoke checks
    cmds:
      - python3 scripts/smoke_backend.py

  smoke:web:
    desc: Run web smoke checks
    cmds:
      - python3 scripts/smoke_web.py

  test:web:
    desc: Run Web frontend tests
    cmds:
      - cd apps/web && npm run build
    silent: true

  samples:
    desc: Build sample zip batches
    cmds:
      - python3 scripts/build_sample_batches.py

  clean:
    desc: Clean temporary files
    cmds:
      - echo "Cleaning up..."
      - docker compose down -v --remove-orphans || true

  status:
    desc: Check git status
    cmds:
      - git status --short
