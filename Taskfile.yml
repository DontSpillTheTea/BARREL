version: '3'

dotenv: ['.env']

tasks:
  default:
    cmds:
      - task --list
    silent: true

  help:
    cmds:
      - task --list
    silent: true

  check-env:
    desc: Check local tooling
    cmds:
      - python3 scripts/check_env.py

  dev:
    desc: Run the full stack locally (requires separate terminals or a multiplexer)
    cmds:
      - echo "Use 'task up:ai' for the turnkey local stack, or run 'task go:ai' and 'task web' separately."

  go:
    desc: Run the Go API locally without Docker
    cmds:
      - cd apps/api && go run cmd/server/main.go

  go:ai:
    desc: Run the Go API locally with AI Native parser settings from .env
    cmds:
      - cd apps/api && PORT=${PORT:-8080} STORAGE_PROVIDER=${STORAGE_PROVIDER:-local} BARREL_STORAGE_DIR=${BARREL_STORAGE_DIR:-/tmp/barrel_storage_local} RULESET_PATH=${RULESET_PATH:-../../rules/ttb} AI_NATIVE_ENABLED=${AI_NATIVE_ENABLED:-true} AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT} AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY} AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-barrel-ai-native-parser} AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2025-01-01-preview} BARREL_DEMO_USERNAME=${BARREL_DEMO_USERNAME:-evaluator} BARREL_DEMO_PASSWORD=${BARREL_DEMO_PASSWORD:-fallback-demo-password-123} BARREL_REVIEW_TOKEN=${BARREL_REVIEW_TOKEN:-demo-eval-token} go run ./cmd/server

  web:
    desc: Run the frontend locally without Docker
    cmds:
      - cd apps/web && npm run dev

  up:
    desc: Run the full stack in the background
    cmds:
      - docker compose up -d --build

  up:ai:
    desc: Run the local AI-native stack in the background
    cmds:
      - |
        test -n "${AZURE_OPENAI_ENDPOINT}" || (echo "AZURE_OPENAI_ENDPOINT is required in .env" && exit 1)
        test "${AZURE_OPENAI_ENDPOINT}" != "https://<your-openai-resource>.openai.azure.com/" || (echo "AZURE_OPENAI_ENDPOINT is still the placeholder value in .env" && exit 1)
        test -n "${AZURE_OPENAI_API_KEY}" || (echo "AZURE_OPENAI_API_KEY is required in .env" && exit 1)
        test "${AZURE_OPENAI_API_KEY}" != "dummy" || (echo "AZURE_OPENAI_API_KEY is still set to dummy in .env" && exit 1)
        STORAGE_PROVIDER=local BARREL_STORAGE_DIR=/tmp/barrel_storage_local AI_NATIVE_ENABLED=true AZURE_OPENAI_DEPLOYMENT=barrel-ai-native-parser AZURE_OPENAI_API_VERSION=2025-01-01-preview docker compose up -d --build api web

  up:offline:
    desc: Run fully offline stack with floci-az (no Azure account needed)
    cmds:
      - docker compose -f docker-compose.offline.yml up -d --build

  down:offline:
    desc: Stop the offline stack
    cmds:
      - docker compose -f docker-compose.offline.yml down

  logs:offline:
    desc: Follow logs for the offline stack
    cmds:
      - docker compose -f docker-compose.offline.yml logs -f

  down:
    desc: Stop the full stack
    cmds:
      - docker compose down

  down:ai:
    desc: Stop the local AI-native stack
    cmds:
      - docker compose down

  restart:
    desc: Restart the full stack
    cmds:
      - docker compose restart

  logs:
    desc: Follow logs from Docker Compose
    cmds:
      - docker compose logs -f

  logs:ai:
    desc: Follow logs for the local AI-native stack
    cmds:
      - docker compose logs -f api web

  doctor:ai:
    desc: Show the local AI-native settings that matter for task up:ai
    cmds:
      - printf "STORAGE_PROVIDER=%s\n" "${STORAGE_PROVIDER}"
      - printf "BARREL_STORAGE_DIR=%s\n" "${BARREL_STORAGE_DIR}"
      - printf "AI_NATIVE_ENABLED=%s\n" "${AI_NATIVE_ENABLED}"
      - printf "AZURE_OPENAI_ENDPOINT=%s\n" "${AZURE_OPENAI_ENDPOINT}"
      - printf "AZURE_OPENAI_API_KEY=%s\n" "$(if [ -n "${AZURE_OPENAI_API_KEY}" ] && [ "${AZURE_OPENAI_API_KEY}" != "dummy" ]; then echo set; else echo missing_or_dummy; fi)"
      - printf "AZURE_OPENAI_DEPLOYMENT=%s\n" "${AZURE_OPENAI_DEPLOYMENT}"
      - printf "AZURE_OPENAI_API_VERSION=%s\n" "${AZURE_OPENAI_API_VERSION}"

  build:
    desc: Build Docker images without starting them
    cmds:
      - docker compose build

  rebuild:
    desc: Down, build, and up the stack
    cmds:
      - task down
      - task build
      - task up

  ps:
    desc: Show running services
    cmds:
      - docker compose ps

  test:
    desc: Run all tests
    cmds:
      - task test:api
      - task test:web

  test:api:
    desc: Run API tests
    cmds:
      - cd apps/api && go test ./...

  smoke:
    desc: Run fast infrastructure smoke tests
    cmds:
      - task smoke:backend
      - task smoke:web

  smoke:backend:
    desc: Run backend smoke checks
    cmds:
      - python3 scripts/smoke_backend.py

  smoke:web:
    desc: Run web smoke checks
    cmds:
      - python3 scripts/smoke_web.py

  smoke:fast-api:
    desc: Test text-only API performance
    cmds:
      - python3 scripts/smoke_performance.py

  test:web:
    desc: Run Web frontend tests
    cmds:
      - cd apps/web && npm run build
    silent: true

  samples:
    desc: Build sample zip batches
    cmds:
      - python3 scripts/build_sample_batches.py

  clean:
    desc: Clean temporary files
    cmds:
      - echo "Cleaning up..."
      - docker compose down -v --remove-orphans || true

  status:
    desc: Check git status
    cmds:
      - git status --short

  azure:check:
    desc: Check if Azure CLI, OpenTofu, and Terragrunt are installed
    cmds:
      - az version || (echo "Azure CLI not found. Please install it (or activate its virtualenv)." && exit 1)
      - tofu version || (echo "OpenTofu not found. Please install it." && exit 1)
      - terragrunt -version || (echo "Terragrunt not found. Please install it." && exit 1)

  azure:login-check:
    desc: Check Azure CLI login
    cmds:
      - az account show || (echo "Please run 'az login'" && exit 1)


  azure:infra:init:
    desc: Initialize OpenTofu via Terragrunt
    cmds:
      - cd infra/terragrunt/dev && terragrunt init

  azure:infra:plan:
    desc: Plan OpenTofu deployment via Terragrunt
    cmds:
      - cd infra/terragrunt/dev && terragrunt plan

  azure:infra:apply:
    desc: Apply OpenTofu deployment via Terragrunt
    cmds:
      - cd infra/terragrunt/dev && terragrunt apply -auto-approve

  azure:infra:destroy:
    desc: Destroy OpenTofu deployment via Terragrunt
    cmds:
      - cd infra/terragrunt/dev && terragrunt destroy -auto-approve

  azure:build:
    desc: Build images for Azure Container Registry
    vars:
      ACR_SERVER:
        sh: az acr list -g barrel-rg-eastus2 --query "[0].loginServer" -o tsv
      TAG:
        sh: git rev-parse --short HEAD || echo "latest"
      API_FQDN:
        sh: az containerapp show -n barrel-api -g barrel-rg-eastus2 --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "barrel-api.placeholder.azurecontainerapps.io"
    cmds:
      - echo "Building API image..."
      - docker build --platform linux/amd64 -t {{.ACR_SERVER}}/barrel-api:{{.TAG}} -f apps/api/Dockerfile .
      - echo "Building Web image (API URL https://{{.API_FQDN}})..."
      - docker build --platform linux/amd64 --build-arg VITE_BUILD_SHA={{.TAG}} --build-arg VITE_API_BASE_URL=https://{{.API_FQDN}} -t {{.ACR_SERVER}}/barrel-web:{{.TAG}} apps/web

  azure:deploy:
    desc: Push images to Azure Container Registry and update Container Apps
    vars:
      ACR_SERVER:
        sh: az acr list -g barrel-rg-eastus2 --query "[0].loginServer" -o tsv
      TAG:
        sh: git rev-parse --short HEAD || echo "latest"
    cmds:
      - az acr login --name {{.ACR_SERVER}}
      - docker push {{.ACR_SERVER}}/barrel-api:{{.TAG}}
      - docker push {{.ACR_SERVER}}/barrel-web:{{.TAG}}
      - az containerapp update -n barrel-api -g barrel-rg-eastus2 --image {{.ACR_SERVER}}/barrel-api:{{.TAG}}
      - az containerapp update -n barrel-web -g barrel-rg-eastus2 --image {{.ACR_SERVER}}/barrel-web:{{.TAG}}

  smoke:local-ai:
    desc: Run AI Native provider tests locally
    cmds:
      - BARREL_API_URL=${BARREL_API_URL:-http://localhost:${PORT:-8080}} BARREL_DEMO_USERNAME=${BARREL_DEMO_USERNAME:-evaluator} BARREL_DEMO_PASSWORD=${BARREL_DEMO_PASSWORD:-fallback-demo-password-123} python3 -u scripts/smoke_local_ai.py

  playwright:local:
    desc: Run Playwright smoke tests against local app
    cmds:
      - cd apps/web && npx playwright test tests/e2e/local-smoke.spec.ts

  azure:smoke:
    desc: Run python smoke tests against deployed Azure app
    cmds:
      - python3 -u scripts/smoke_azure.py

  azure:smoke:ai-native:
    desc: Run AI Native provider tests
    cmds:
      - python3 -u scripts/smoke_ai_provider.py

  azure:outputs:
    desc: Show OpenTofu outputs
    cmds:
      - cd infra/terragrunt/dev && terragrunt output
