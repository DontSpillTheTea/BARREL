
services:
  web:
    build:
      context: apps/web
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: production
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
      RULESET_PATH: /rules/ttb
      MAX_UPLOAD_MB: 25
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      BARREL_STORAGE_DIR: ${BARREL_STORAGE_DIR:-/tmp/barrel_storage_local}
      AI_NATIVE_ENABLED: ${AI_NATIVE_ENABLED:-true}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-barrel-ai-native-parser}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-01-01-preview}
      BARREL_DEMO_USERNAME: ${BARREL_DEMO_USERNAME:-evaluator}
      BARREL_DEMO_PASSWORD: ${BARREL_DEMO_PASSWORD:-fallback-demo-password-123}
      BARREL_REVIEW_TOKEN: ${BARREL_REVIEW_TOKEN:-demo-eval-token}
    volumes:
      - ./rules:/rules:ro
    command: ["go", "run", "./cmd/server"]
